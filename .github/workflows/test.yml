name: Tests

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  format:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run formatting
        run: npm run format

  unit_test:
    needs: format

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check compilation errors on TypeScript files
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:run

  render_test:
    needs: format

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render thumbnail
        run: npx remotion still --frame 60 ItQuizComposition out/thumbnail_rendered.png
      
      - name: Run regression tests for thumbnail
        uses: reg-viz/reg-actions@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          image-directory-path: ./out

      - name: Render video
        run: npx remotion render --frames 0-2700 ItQuizComposition out/ItQuizComposition.mp4

      - uses: actions/upload-artifact@v5
        with:
          name: ItQuizComposition
          path: out/ItQuizComposition.mp4
          retention-days: 7

  lint:
    needs: format

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint